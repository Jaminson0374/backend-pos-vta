spring:
  application:
    name: pos-invent
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev

app:
  media:
    storage-path: ${APP_MEDIA_STORAGE_PATH:./media}
  security:
    certificate:
      secret-key: ${CERT_SECRET_KEY}
    rate-limit:
      trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED:false}
      max-buckets: ${RATE_LIMIT_MAX_BUCKETS:10000}
      # capacities/windows use the record defaults unless overridden
  inventory:
    auto-dispose: false
    expiration-warning-days: 30
  dian:
    provider: ${DIAN_PROVIDER:mock}
    siigo:
      username: ${SIIGO_USERNAME:}
      access-key: ${SIIGO_ACCESS_KEY:}
      partner-id: ${SIIGO_PARTNER_ID:}
      base-url: ${SIIGO_BASE_URL:https://api.siigo.com}
      document-type-id: ${SIIGO_DOCUMENT_TYPE_ID:1}
      seller-id: ${SIIGO_SELLER_ID:}
      stamp-send: ${SIIGO_STAMP_SEND:true}
      mail-send: ${SIIGO_MAIL_SEND:false}
      tax-id-iva-0: ${SIIGO_TAX_ID_IVA_0:}
      tax-id-iva-5: ${SIIGO_TAX_ID_IVA_5:}
      tax-id-iva-19: ${SIIGO_TAX_ID_IVA_19:}
      payment-type-cash: ${SIIGO_PAYMENT_TYPE_CASH:}
      payment-type-card: ${SIIGO_PAYMENT_TYPE_CARD:}
      payment-type-transfer: ${SIIGO_PAYMENT_TYPE_TRANSFER:}
      payment-type-check: ${SIIGO_PAYMENT_TYPE_CHECK:}
    thefactory:
      token-empresa: ${FACTORY_API_TOKEN:}
      token-password: ${FACTORY_API_PASSWORD:}
      base-url: ${FACTORY_API_URL:https://demoemision21.thefactoryhka.com.co/ws/v1.0/Service.svc}
      test-env: ${FACTORY_TEST_ENV:true}
      connect-timeout-ms: ${FACTORY_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${FACTORY_READ_TIMEOUT_MS:15000}
      numbering-range: ${FACTORY_NUMBERING_RANGE:}
      document-type: ${FACTORY_DOCUMENT_TYPE:01}
      operation-type: ${FACTORY_OPERATION_TYPE:05}
      currency: ${FACTORY_CURRENCY:COP}
      tax-code-iva: ${FACTORY_TAX_CODE_IVA:01}
      tax-code-inc: ${FACTORY_TAX_CODE_INC:04}
      unit-measure: ${FACTORY_UNIT_MEASURE:UN}
      payment-method: ${FACTORY_PAYMENT_METHOD:1}
      discount-code: ${FACTORY_DISCOUNT_CODE:00}
      final-consumer-identification: ${FACTORY_FINAL_CONSUMER_IDENTIFICATION:222222222222}
      final-consumer-identification-type: ${FACTORY_FINAL_CONSUMER_IDENTIFICATION_TYPE:13}
      final-consumer-name: ${FACTORY_FINAL_CONSUMER_NAME:Consumidor final}

---
spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/posinvent_db
    username: ${DB_USER:posinvent}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  dian:
    siigo:
      username: ${SIIGO_USERNAME}
      access-key: ${SIIGO_ACCESS_KEY}
      partner-id: ${SIIGO_PARTNER_ID}
