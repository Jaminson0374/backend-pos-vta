spring:
  application:
    name: pos-invent
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev

app:
  media:
    storage-path: ${APP_MEDIA_STORAGE_PATH:./media}
  inventory:
    auto-dispose: false
    expiration-warning-days: 30

---
spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/posinvent_db
    username: ${DB_USER:posinvent}
    password: ${DB_PASS:posinvent123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/posinvent_audit
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:posinvent-dev-jwt-secret-key-v1-must-be-at-least-64-bytes-for-hs512!!}
    expiration-ms: 86400000
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    mongodb:
      uri: ${MONGO_URI}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
