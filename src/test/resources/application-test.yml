spring:
  task:
    scheduling:
      enabled: false
  datasource:
    hikari:
      # The concurrency integration tests run up to 30 threads, each opening its own
      # REQUIRES_NEW transaction; the default pool (10) exhausts and fails the suite.
      maximum-pool-size: 40
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  mail:
    host: localhost
    port: 3025
  security:
    enabled: false

app:
  jwt:
    secret: test-jwt-secret-key-for-integration-tests-must-be-at-least-64-bytes-long!!!
    expiration-ms: 86400000
  frontend-url: http://localhost:4200
  media:
    storage-path: ./media-test
  inventory:
    auto-dispose: false
    expiration-warning-days: 30
    concurrency:
      max-attempts: 300
