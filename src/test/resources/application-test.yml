spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
  task:
    scheduling:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  mail:
    host: localhost
    port: 3025
  security:
    enabled: false

app:
  jwt:
    secret: test-jwt-secret-key-for-integration-tests-must-be-at-least-64-bytes-long!!!
    expiration-ms: 86400000
  frontend-url: http://localhost:4200
  media:
    storage-path: ./media-test
  inventory:
    auto-dispose: false
    expiration-warning-days: 30
    concurrency:
      max-attempts: 300
